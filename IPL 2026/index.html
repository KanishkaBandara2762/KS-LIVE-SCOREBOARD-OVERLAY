<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS Live Cricket Scoreboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="scoreboard">

        <!-- LEFT TEAM -->
        <div class="team team-left">
            COL
        </div>

        <!-- BATSMAN PANEL -->
        <div class="player-panel">

            <div class="striker-indicator"></div>

            <div class="player-row">
                <div class="player-name">
                    RAJU GAHO
                </div>

                <div class="player-score">
                    26 <span class="balls">(6)</span>
                </div>
            </div>

            <div class="player-row">
                <div class="player-name">
                    GAHZI
                </div>

                <div class="player-score">
                    6 <span class="balls">(3)</span>
                </div>
            </div>

        </div>

        <!-- CENTER PANEL -->
        <div class="center-section">

            <div class="score-capsule">

                <span class="score-team">COL</span>

                <span class="score-main">
                    35-0
                </span>

                <span class="score-overs">
                    1.3 / 5
                </span>

            </div>

            <div class="projected-score">
                PROJECTED SCORE: 117
            </div>

        </div>

        <!-- BOWLER PANEL -->
        <div class="bowler-panel">



            <div class="bowler-header">

                <div class="bowler-name">
                    CSV
                </div>

                <div class="bowler-figures">
                    0-10 (0.3)
                </div>

            </div>

            <div class="last-balls">

                <div class="ball">
                    1
                </div>

                <div class="ball four">
                    4
                </div>

                <div class="ball">
                    5
                </div>

            </div>

        </div>

        <!-- RIGHT TEAM -->
        <div class="team team-right">
            KAN
        </div>

    </div>

</body>

</html>
