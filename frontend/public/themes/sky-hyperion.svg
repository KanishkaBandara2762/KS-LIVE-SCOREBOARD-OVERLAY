<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181e" />
      <stop offset="100%" stop-color="#0e0f13" />
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#040608" />

  <!-- Main Board Container with yellow left accent bar -->
  <rect x="40" y="45" width="1120" height="130" rx="6" fill="url(#skyBg)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
  <rect x="40" y="45" width="8" height="130" fill="#e6ff00" rx="3" />

  <!-- Team Column -->
  <circle cx="105" cy="110" r="32" fill="#1f232b" stroke="#e6ff00" stroke-width="2" />
  <text x="105" y="117" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" text-anchor="middle">ENG</text>

  <text x="155" y="102" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="1">ENGLAND</text>
  <text x="155" y="125" fill="#8e929b" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">SKY SPORTS CRICKET HD • 1ST TEST</text>

  <!-- Big Score -->
  <text x="370" y="118" fill="#e6ff00" font-family="'Outfit', sans-serif" font-weight="900" font-size="50">242-4</text>
  <text x="370" y="142" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" letter-spacing="1">54.2 OVERS (CRR: 4.45)</text>

  <!-- Vertical Divider -->
  <line x1="510" y1="55" x2="510" y2="165" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Batsmen Section -->
  <rect x="535" y="82" width="46" height="18" rx="3" fill="#e6ff00" />
  <text x="558" y="95" fill="#000000" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">STRIKE</text>

  <text x="590" y="96" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16">J. ROOT</text>
  <text x="730" y="96" fill="#e6ff00" font-family="'Outfit', sans-serif" font-weight="900" font-size="18">84* <tspan fill="#8e929b" font-size="13">(112)</tspan></text>

  <text x="590" y="138" fill="#8e929b" font-family="'Outfit', sans-serif" font-weight="700" font-size="16">B. STOKES</text>
  <text x="730" y="138" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">42 <tspan fill="#8e929b" font-size="13">(55)</tspan></text>

  <!-- Vertical Divider -->
  <line x1="815" y1="55" x2="815" y2="165" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Bowler Section -->
  <text x="835" y="85" fill="#e6ff00" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" letter-spacing="1.5">CURRENT BOWLER</text>
  <text x="835" y="108" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="17">P. CUMMINS</text>
  <text x="835" y="134" fill="#8e929b" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">2-48 (12.2) • ECON 3.89</text>

  <!-- The Hundred Style Continuous Delivery Pills -->
  <g transform="translate(970, 95)">
    <rect x="0" y="0" width="24" height="30" rx="4" fill="#1f232b" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="12" y="20" fill="#cbd5e1" font-size="12" font-weight="900" text-anchor="middle">0</text>

    <rect x="30" y="0" width="24" height="30" rx="4" fill="#1f232b" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="42" y="20" fill="#cbd5e1" font-size="12" font-weight="900" text-anchor="middle">1</text>

    <rect x="60" y="0" width="24" height="30" rx="4" fill="#e6ff00" />
    <text x="72" y="20" fill="#000000" font-size="12" font-weight="900" text-anchor="middle">4</text>

    <rect x="90" y="0" width="24" height="30" rx="4" fill="#ff0055" />
    <text x="102" y="20" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">6</text>

    <rect x="120" y="0" width="24" height="30" rx="4" fill="#dc2626" />
    <text x="132" y="20" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">W</text>
  </g>

  <!-- Right Logo -->
  <circle cx="1125" cy="110" r="26" fill="#1f232b" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <text x="1125" y="116" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" text-anchor="middle">AUS</text>
</svg>

