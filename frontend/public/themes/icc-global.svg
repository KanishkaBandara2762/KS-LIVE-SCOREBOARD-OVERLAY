<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="iccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c1a" />
      <stop offset="50%" stop-color="#0e152b" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>
    <linearGradient id="iccGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="50%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#ff5493" />
    </linearGradient>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#04060b" />

  <!-- Top Ribbon -->
  <path d="M 30 25 L 1170 25 L 1160 55 L 40 55 Z" fill="#0b1224" stroke="rgba(0,245,255,0.3)" stroke-width="1" />
  <rect x="30" y="25" width="1140" height="3" fill="url(#iccGlow)" />
  <circle cx="58" cy="40" r="5" fill="#ff0055" filter="url(#neonCyan)" />
  <text x="74" y="44" fill="#ffffff" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="12" letter-spacing="2">LIVE • ICC T20 GLOBAL APEX | MATCH 28</text>
  <text x="960" y="44" fill="#00f5ff" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">CRR: 9.24 • TARGET: 198 (RRR: 11.50)</text>

  <!-- Main Scoreboard Container -->
  <rect x="30" y="55" width="1140" height="135" rx="8" fill="url(#iccBg)" stroke="rgba(0,245,255,0.4)" stroke-width="1.5" />

  <!-- Team 1 Badge -->
  <circle cx="95" cy="122" r="34" fill="#0a1931" stroke="url(#cyanGrad)" stroke-width="3" />
  <text x="95" y="129" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" text-anchor="middle">IND</text>

  <text x="145" y="115" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="1">INDIA</text>
  <text x="145" y="136" fill="#00f5ff" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" letter-spacing="2">T20 WORLD CUP • 1ST INNINGS</text>

  <!-- Big Score -->
  <text x="350" y="130" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="48" filter="url(#neonCyan)">184/3</text>
  <text x="350" y="152" fill="#ff007a" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" letter-spacing="1.5">17.4 / 20 OVERS</text>

  <!-- Divider -->
  <line x1="490" y1="65" x2="490" y2="180" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Batsmen -->
  <path d="M 515 98 L 525 104 L 515 110 Z" fill="#00f5ff" filter="url(#neonCyan)" />
  <text x="535" y="106" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="16">V. KOHLI</text>
  <text x="690" y="106" fill="#00f5ff" font-family="'Outfit', sans-serif" font-weight="900" font-size="18">68* <tspan fill="#94a3b8" font-size="13">(42)</tspan></text>
  <text x="750" y="106" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">SR 161.9</text>

  <text x="535" y="145" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">H. PANDYA</text>
  <text x="690" y="145" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">34 <tspan fill="#94a3b8" font-size="13">(16)</tspan></text>
  <text x="750" y="145" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">SR 212.5</text>

  <!-- Divider -->
  <line x1="820" y1="65" x2="820" y2="180" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Bowler -->
  <text x="840" y="94" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" letter-spacing="1">CURRENT BOWLER</text>
  <text x="840" y="118" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="17">M. STARC</text>
  <text x="840" y="142" fill="#00f5ff" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">1-38 (3.4)</text>

  <!-- Over Track Balls -->
  <g transform="translate(950, 105)">
    <circle cx="15" cy="15" r="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="15" y="20" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">1</text>

    <circle cx="48" cy="15" r="14" fill="#00f5ff" />
    <text x="48" y="20" fill="#000000" font-size="12" font-weight="900" text-anchor="middle">4</text>

    <circle cx="81" cy="15" r="14" fill="#ff007a" filter="url(#neonCyan)" />
    <text x="81" y="20" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">6</text>

    <circle cx="114" cy="15" r="14" fill="#ff1744" />
    <text x="114" y="20" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">W</text>

    <circle cx="147" cy="15" r="14" fill="#1e293b" />
    <text x="147" y="20" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">0</text>
  </g>

  <!-- Opponent Logo -->
  <circle cx="1135" cy="122" r="28" fill="#162238" stroke="url(#pinkGrad)" stroke-width="2" />
  <text x="1135" y="128" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="15" text-anchor="middle">AUS</text>
</svg>

