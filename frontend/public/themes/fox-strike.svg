<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="foxBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18191d" />
      <stop offset="100%" stop-color="#101014" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#050507" />

  <!-- Slanted Main Board -->
  <g transform="skewX(-8) translate(25, 0)">
    <rect x="40" y="45" width="1120" height="130" fill="url(#foxBg)" stroke="#ff4500" stroke-width="2.5" />
    <rect x="40" y="45" width="12" height="130" fill="url(#fireGrad)" />

    <!-- Left Batting Block -->
    <rect x="52" y="45" width="440" height="130" fill="rgba(255,69,0,0.12)" />
    <line x1="492" y1="45" x2="492" y2="175" stroke="#ff4500" stroke-width="2" />
    <line x1="790" y1="45" x2="790" y2="175" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
  </g>

  <!-- Content rendered upright or styled inside -->
  <circle cx="105" cy="110" r="32" fill="#25262c" stroke="#ff4500" stroke-width="2.5" />
  <text x="105" y="117" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" text-anchor="middle">SIX</text>

  <text x="155" y="102" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" font-style="italic" letter-spacing="1">SYDNEY SIXERS</text>
  <text x="155" y="125" fill="#ffb700" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" font-style="italic" letter-spacing="1.5">FOX CRICKET • BBL SUPERCLASH</text>

  <!-- Big Orange Score -->
  <text x="375" y="118" fill="#ff5722" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="50" filter="url(#fireGlow)">178/4</text>
  <text x="375" y="142" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="13" letter-spacing="1">16.5 OVERS (20 OV)</text>

  <!-- Batsmen Section -->
  <polygon points="525,90 535,96 525,102" fill="#ff4500" filter="url(#fireGlow)" />
  <text x="545" y="98" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="16">J. VINCE</text>
  <text x="695" y="98" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="18">75* <tspan fill="#9ca3af" font-size="13">(44)</tspan></text>

  <text x="545" y="138" fill="#9ca3af" font-family="'Outfit', sans-serif" font-weight="800" font-style="italic" font-size="16">D. HUGHES</text>
  <text x="695" y="138" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-style="italic" font-size="18">22 <tspan fill="#9ca3af" font-size="13">(14)</tspan></text>

  <!-- Bowler Section -->
  <text x="815" y="85" fill="#ff9800" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="10" letter-spacing="1.5">BOWLER</text>
  <text x="815" y="108" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="17">G. MAXWELL</text>
  <text x="815" y="134" fill="#ff5722" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="14">2-29 (3.5)</text>

  <!-- Hexagonal / Square Angular Ball Pills -->
  <g transform="translate(955, 95)">
    <rect x="0" y="0" width="26" height="26" fill="#25262c" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="13" y="18" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">1</text>

    <rect x="32" y="0" width="26" height="26" fill="#ff9800" />
    <text x="45" y="18" fill="#000000" font-size="12" font-weight="900" text-anchor="middle">4</text>

    <rect x="64" y="0" width="26" height="26" fill="#ff1744" filter="url(#fireGlow)" />
    <text x="77" y="18" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">6</text>

    <rect x="96" y="0" width="26" height="26" fill="#ffffff" />
    <text x="109" y="18" fill="#d50000" font-size="12" font-weight="900" text-anchor="middle">W</text>

    <rect x="128" y="0" width="26" height="26" fill="#25262c" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="141" y="18" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">0</text>
  </g>

  <!-- Opponent Logo -->
  <circle cx="1135" cy="110" r="28" fill="#25262c" stroke="#ff4500" stroke-width="2" />
  <text x="1135" y="117" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">STA</text>
</svg>

