<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS LIVE Emerald Cricket Overlay</title>
    <link rel="stylesheet" href="KS_LIVE_Emerald_Cricket_Pro_Theme.css">
</head>

<body style="margin:0;background:#111;">

    <div class="ksp-wrapper">
        <div class="ksp-bg-pattern"></div>

        <div class="ksp-board">

            <div class="ksp-top-bar">
                <div class="ksp-live-dot"></div>
                <span>LIVE • UNIVERSITY PREMIER LEAGUE 2026</span>
            </div>

            <div class="ksp-left">
                <img class="ksp-logo" src="team1.png" alt="Team 1 Logo">
                <div class="ksp-team-info">
                    <div class="ksp-team-name">VAVUNIYA TITANS</div>
                    <div class="ksp-tournament">KS LIVE BROADCASTING</div>
                </div>
            </div>

            <div class="ksp-center">
                <div class="ksp-score-wrapper">
                    <div class="ksp-score">156/4</div>
                    <div>
                        <div class="ksp-overs">17.2</div>
                        <div class="ksp-overs-max">20 OVERS</div>
                    </div>
                </div>
            </div>

            <div class="ksp-right">
                <div>
                    <div><strong>★ Perera</strong> <span class="ksp-batter-runs">68 (42)</span></div>
                    <div><strong>Silva</strong> <span class="ksp-batter-runs">34 (21)</span></div>
                </div>

                <div>
                    <div class="ksp-bowler-title">CURRENT BOWLER</div>
                    <div><strong>Fernando</strong> <span class="ksp-bowler-figs">2/28</span></div>
                </div>
            </div>

            <div class="ksp-ball-tracker">
                <div class="ksp-ball">1</div>
                <div class="ksp-ball four">4</div>
                <div class="ksp-ball">.</div>
                <div class="ksp-ball six">6</div>
                <div class="ksp-ball">2</div>
                <div class="ksp-ball wicket">W</div>
            </div>

        </div>
    </div>

</body>

</html>
