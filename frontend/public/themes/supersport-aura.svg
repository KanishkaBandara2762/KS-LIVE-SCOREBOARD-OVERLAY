<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#040812" />

  <!-- Glassmorphic Rounded Board -->
  <rect x="40" y="45" width="1120" height="130" rx="20" fill="url(#ssBg)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
  <rect x="40" y="45" width="1120" height="3" fill="url(#auraGlow)" rx="1.5" />

  <!-- Team Box Left -->
  <circle cx="105" cy="110" r="32" fill="#132337" stroke="#10b981" stroke-width="2" />
  <text x="105" y="117" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" text-anchor="middle">SA</text>

  <text x="155" y="102" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">SOUTH AFRICA</text>
  <text x="155" y="125" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">SUPERSPORT CRICKET • LIVE ODI</text>

  <!-- Emerald Score -->
  <text x="400" y="118" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="48" filter="url(#emeraldGlow)">215/3</text>
  <text x="400" y="142" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" letter-spacing="1">38.4 / 50 OVERS</text>

  <!-- Divider -->
  <line x1="535" y1="65" x2="535" y2="155" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Batsmen Section -->
  <circle cx="560" cy="94" r="4" fill="#10b981" filter="url(#emeraldGlow)" />
  <text x="575" y="98" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16">Q. DE KOCK</text>
  <text x="735" y="98" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="18">92* <tspan fill="#94a3b8" font-size="13">(86)</tspan></text>

  <text x="575" y="138" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="16">A. MARKRAM</text>
  <text x="735" y="138" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">44 <tspan fill="#94a3b8" font-size="13">(40)</tspan></text>

  <!-- Divider -->
  <line x1="820" y1="65" x2="820" y2="155" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Bowler Section -->
  <text x="840" y="85" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" letter-spacing="1.5">CURRENT BOWLER</text>
  <text x="840" y="108" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="17">S. AFRIDI</text>
  <text x="840" y="134" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">1-36 (7.4)</text>

  <!-- Translucent Ball Track -->
  <g transform="translate(965, 95)">
    <circle cx="15" cy="15" r="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="15" y="19" fill="#cbd5e1" font-size="11" font-weight="900" text-anchor="middle">0</text>

    <circle cx="45" cy="15" r="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="45" y="19" fill="#cbd5e1" font-size="11" font-weight="900" text-anchor="middle">1</text>

    <circle cx="75" cy="15" r="13" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <text x="75" y="19" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">4</text>

    <circle cx="105" cy="15" r="13" fill="#7c3aed" stroke="#c084fc" stroke-width="1" />
    <text x="105" y="19" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">6</text>

    <circle cx="135" cy="15" r="13" fill="#e11d48" stroke="#fda4af" stroke-width="1" />
    <text x="135" y="19" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">W</text>
  </g>

  <!-- Opponent Logo -->
  <circle cx="1135" cy="110" r="28" fill="#132337" stroke="#38bdf8" stroke-width="2" />
  <text x="1135" y="117" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">PAK</text>
</svg>

