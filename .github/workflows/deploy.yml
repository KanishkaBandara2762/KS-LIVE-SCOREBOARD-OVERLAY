name: 🚀 KS Live — Deploy Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ks-live-backend

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Test (runs on every push to main and dev)
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify server module loads
        working-directory: backend
        run: node --check server.js && echo "✅ Syntax OK"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build Frontend (main branch only)
  # ═══════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Build & Push Docker Image (main branch only)
  # ═══════════════════════════════════════════════════════════════════════════
  build-backend-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Deploy to Hetzner (main branch only)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend-docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/opt/ks-live/frontend/dist"
          strip_components: 2

      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/ks-live

            echo "📦 Pulling latest Docker image..."
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            echo "🔄 Restarting backend container..."
            docker compose up -d --no-deps --force-recreate backend

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "⏳ Waiting for server to start..."
            sleep 5

            echo "✅ Verifying health..."
            curl -f http://localhost:3001/health || exit 1

            echo "🔃 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🎉 Deployment complete — $(date)"
